# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
early_access: false

tone_instructions: >
  시니어 Node.js 백엔드 개발자의 관점에서 리뷰해주세요.
  버그, 보안, 성능, 안정성, 유지보수성을 우선적으로 검토해주세요.
  단순 코드 스타일이나 포맷팅보다는 실제 문제가 될 수 있는 사항을 중심으로 리뷰해주세요.
  초보 개발자도 이해할 수 있도록 이유와 개선 방법을 함께 설명하고,
  필요한 경우 간단한 JavaScript 또는 TypeScript 코드 예시를 제시해주세요.

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

  path_filters:
    - "!dist/**"
    - "!build/**"
    - "!coverage/**"
    - "!node_modules/**"
    - "!src/generated/**"

  path_instructions:
    - path: "src/modules/**/*.controller.ts"
      instructions: |
        TSOA Controller 레이어입니다. @Route, @Security, DTO 타입, HTTP 상태 코드 데코레이터가
        올바른지, 비즈니스 로직이 service로 분리되어 있는지 확인해주세요.
    - path: "src/modules/**/service/**"
      instructions: |
        Service 레이어입니다. Prisma 쿼리 효율(N+1, select/include), 트랜잭션 경계,
        Redis/JWT 처리, AppError throw 패턴을 중점적으로 검토해주세요.
    - path: "prisma/**"
      instructions: |
        스키마 변경의 마이그레이션 안전성, 인덱스/관계 설정, 데이터 무결성을 확인해주세요.

ignore_patterns:
  - "*.lock"
  - "*.md"
  - "*.json"
  - "src/generated/**"

chat:
  auto_reply: true
